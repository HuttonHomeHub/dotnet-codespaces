name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ASPIRE_CLI_VERSION: 13.6.1

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version $ASPIRE_CLI_VERSION

      - name: Restore dependencies
        run: dotnet restore PhotoMapper.slnx

      - name: Check formatting
        run: dotnet format PhotoMapper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PhotoMapper.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PhotoMapper.slnx --no-build --configuration Release
