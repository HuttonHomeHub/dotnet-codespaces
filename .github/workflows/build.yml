name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASPIRE_CLI_VERSION: 13.6.1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      # Directory.Build.props turns on RestoreLockedMode under GitHub Actions, so this fails if a
      # packages.lock.json is stale.
      - name: Restore dependencies
        run: dotnet restore PhotoMapper.slnx

      - name: Check formatting
        run: dotnet format PhotoMapper.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PhotoMapper.slnx --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test --solution PhotoMapper.slnx --no-build --configuration Release
          --results-directory "$GITHUB_WORKSPACE/TestResults" --report-xunit-trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults
          if-no-files-found: error
